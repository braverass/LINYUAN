$schema: "https://json-schema.org/draft/2020-12/schema"
title: "PATCH Spec 0.5"
type: object
additionalProperties: false
required: [draft, violation]
properties:
  draft:
    type: string
  violation:
    type: object
    additionalProperties: false
    required:
      - id
      - severity
      - location
      - actual
      - required_state
      - patch_contract
    properties:
      id: { type: string, minLength: 1 }
      severity:
        enum: [hard, soft]
      location:
        type: object
        additionalProperties: false
        required: [paragraph, sentence_start, sentence_end]
        properties:
          paragraph: { type: integer, minimum: 1 }
          sentence_start: { type: integer, minimum: 1 }
          sentence_end: { type: integer, minimum: 1 }
      actual:
        type: object
        additionalProperties: false
        required: [semantic_claim]
        properties:
          semantic_claim: { type: string }
      required_state:
        type: object
      patch_contract:
        type: object
        additionalProperties: false
        required: [allowed_scope, preserve, required_change]
        properties:
          allowed_scope:
            type: object
            additionalProperties: false
            required: [paragraph, sentences]
            properties:
              paragraph: { type: integer, minimum: 1 }
              sentences:
                type: array
                minItems: 2
                maxItems: 2
                prefixItems:
                  - { type: integer, minimum: 1 }
                  - { type: integer, minimum: 1 }
          preserve:
            type: array
            items: { type: string }
          required_change:
            type: array
            minItems: 1
            items: { type: string }

# Raw Canon, provenance and evidence_refs are intentionally absent.
# Patcher output is only:
# { replacement: string }
