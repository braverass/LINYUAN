name: Spec 1.0 Evidence Verification

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "package.json"
      - "SPEC-0.9-LIVE-E2E.md"
      - "SPEC-1.0-EVIDENCE-VERIFICATION.md"
      - ".github/workflows/spec-0.9-live.yml"
      - ".github/workflows/spec-1.0.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "package.json"
      - "SPEC-0.9-LIVE-E2E.md"
      - "SPEC-1.0-EVIDENCE-VERIFICATION.md"
      - ".github/workflows/spec-0.9-live.yml"
      - ".github/workflows/spec-1.0.yml"

permissions:
  contents: read

jobs:
  evidence-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert recheck code ancestry
        run: git merge-base --is-ancestor 73e6fcc30c4f82e478635f16c8eb9718025f5a31 HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run ci

  verifier-original-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5991e938d13458cbd52f9020a6834ce138b590f4
          fetch-depth: 1
      - name: Assert exact original target
        run: test "$(git rev-parse HEAD)" = "5991e938d13458cbd52f9020a6834ce138b590f4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts
      - run: npm run ci

  verifier-secret-presence:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" && echo "OPENAI_API_KEY=present" || echo "OPENAI_API_KEY=absent"
          test -n "$GEMINI_API_KEY" && echo "GEMINI_API_KEY=present" || echo "GEMINI_API_KEY=absent"
          test -n "$ANTHROPIC_API_KEY" && echo "ANTHROPIC_API_KEY=present" || echo "ANTHROPIC_API_KEY=absent"
