name: Spec 1.0 Evidence Verification

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "SOURCE_REGISTRY.yaml"
      - "MODE-FICTION.md"
      - "00*.md"
      - "01-*.md"
      - "02-*.md"
      - "03-*.md"
      - "04-*.md"
      - "05-*.md"
      - "package.json"
      - "package-lock.json"
      - "SPEC-0.9-LIVE-E2E.md"
      - "SPEC-1.0-EVIDENCE-VERIFICATION.md"
      - ".github/workflows/spec-0.9-live.yml"
      - ".github/workflows/spec-1.0.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "SOURCE_REGISTRY.yaml"
      - "MODE-FICTION.md"
      - "00*.md"
      - "01-*.md"
      - "02-*.md"
      - "03-*.md"
      - "04-*.md"
      - "05-*.md"
      - "package.json"
      - "package-lock.json"
      - "SPEC-0.9-LIVE-E2E.md"
      - "SPEC-1.0-EVIDENCE-VERIFICATION.md"
      - ".github/workflows/spec-0.9-live.yml"
      - ".github/workflows/spec-1.0.yml"

permissions:
  contents: read

jobs:
  evidence-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run ci
