name: Independent Secret Presence Probe

on:
  pull_request:
    branches:
      - verify/secret-probe-base-1a403a0

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY_PRESENT=yes"; else echo "OPENAI_API_KEY_PRESENT=no"; fi
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY_PRESENT=yes"; else echo "GEMINI_API_KEY_PRESENT=no"; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY_PRESENT=yes"; else echo "ANTHROPIC_API_KEY_PRESENT=no"; fi
