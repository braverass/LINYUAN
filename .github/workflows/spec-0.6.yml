name: Spec 0.6 Evaluation Harness

on:
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "runtime/**"
      - "SOURCE_REGISTRY.yaml"
      - "00*.md"
      - "01-*.md"
      - "02-*.md"
      - "03-*.md"
      - "04-*.md"
      - "05-*.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/spec-0.6.yml"
  pull_request:
    paths:
      - "evals/**"
      - "runtime/**"
      - "SOURCE_REGISTRY.yaml"
      - "00*.md"
      - "01-*.md"
      - "02-*.md"
      - "03-*.md"
      - "04-*.md"
      - "05-*.md"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/spec-0.6.yml"

jobs:
  evaluation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run ci
