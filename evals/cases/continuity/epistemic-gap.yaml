version: "0.6"
id: "continuity.epistemic-gap"
category: "continuity"
description: "Author knowledge must not silently become character knowledge when continuity state is missing."
request: "续写上一场景：A 现在质问 B 关于秘密 X。"
scene_state:
  location: "same as previous scene"
  character_A_knows_X: null
  previous_scene_excerpt: null
required_sources:
  - "AUTHOR.ROUTER"
requirements:
  - id: "REQ_CHARACTER_KNOWLEDGE_BOUNDARY"
    kind: "constraint"
    description: "Character knowledge requires scene continuity evidence and cannot be inferred from author-facing Canon."
forbidden_inferences:
  - id: "FI_AUTHOR_TO_CHARACTER_KNOWLEDGE"
    description: "A fact known to the runtime is automatically known to character A."
forbidden_overconstraints:
  - id: "OC_INVENTED_PREVIOUS_SCENE"
    description: "Compiler fabricates continuity details to make the scene writable."
expected_need_context:
  - "CHARACTER_A_KNOWS_X"
  - "PREVIOUS_SCENE_EXCERPT"
behavioral_diversity:
  sample_count: 0
  minimum_unique_signatures: 0
validator:
  gold_violations:
    - "V_EPISTEMIC_LEAK"
  gold_non_violations:
    - "N_REQUESTS_CONTINUITY"
metamorphic_group: null
synthetic_canon: null
